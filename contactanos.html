        const email = document.getElementById('email');
        email.classList.add('d-none'); // ocular el formulario
        const loading = document.getElementById('spinnerEmail');
        loading.classList.remove('d-none'); // Mostrar el loading
        e.preventDefault();
  
        emailjs.sendForm('service_0sld7l8', 'template_llh777t', e.target)
          .then(() => {
            e.target.reset();
          }, (error) => {
            alert('Error al enviar: ' + JSON.stringify(error));

            var myModal = new bootstrap.Modal(document.getElementById('successModal'));
            myModal.show();
            loading.classList.add('d-none'); // Ocultar el loading
